<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a2342">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>R2D2 Controller</title>

  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/controller.css">
</head>

<body class="controller-page">
  <header class="ctrl-header">
    <a class="ctrl-icon-button" href="/" aria-label="Back to dashboard">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </a>

    <h1>R2D2</h1>

    <span id="ctrl-link" class="ctrl-link" data-state="connecting">connecting</span>

    <button id="ctrl-fullscreen" class="ctrl-icon-button" type="button" aria-label="Toggle fullscreen" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
    </button>
  </header>

  <main class="ctrl-pad">
    <!-- One section per joystick. data-stick is the id sent to the hub,
         data-lock="x" / "y" restricts the stick to that axis. -->
    <section class="ctrl-stick" data-stick="drive">
      <h2>Drive</h2>
      <div class="ctrl-zone"></div>
      <output class="ctrl-readout"></output>
    </section>

    <button id="ctrl-stop" class="ctrl-stop" type="button">Stop</button>

    <section class="ctrl-stick" data-stick="head" data-lock="x">
      <h2>Head</h2>
      <div class="ctrl-zone"></div>
      <output class="ctrl-readout"></output>
    </section>
  </main>

  <script type="module" src="/static/js/controller.js"></script>
</body>
</html>
